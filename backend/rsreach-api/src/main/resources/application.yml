spring:
  application:
    name: rsreach-api
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${RSREACH_DB_URL:jdbc:postgresql://localhost:5432/rsreach}
    username: ${RSREACH_DB_USER:rsreach}
    password: ${RSREACH_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${RSREACH_DB_POOL_SIZE:10}
      minimum-idle: ${RSREACH_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${RSREACH_DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${RSREACH_API_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.rsreach: INFO
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"

rsreach:
  app:
    role: api
  webhooks:
    allow-mock-signatures: ${RSREACH_WEBHOOKS_ALLOW_MOCK_SIGNATURES:true}
  whatsapp:
    live-enabled: ${RSREACH_WHATSAPP_LIVE_ENABLED:false}
    api-base-url: ${RSREACH_WHATSAPP_API_BASE_URL:https://graph.facebook.com/v21.0}
    app-secret: ${RSREACH_WHATSAPP_APP_SECRET:}
    verify-token: ${RSREACH_WHATSAPP_VERIFY_TOKEN:}
  email:
    delivery-live-enabled: ${RSREACH_EMAIL_DELIVERY_LIVE_ENABLED:false}
    mailbox-live-enabled: ${RSREACH_MAILBOX_LIVE_ENABLED:false}
  media:
    object-store-enabled: ${RSREACH_MEDIA_OBJECT_STORE_ENABLED:false}
    minio-endpoint: ${RSREACH_MEDIA_MINIO_ENDPOINT:http://minio:9000}
    minio-bucket: ${RSREACH_MEDIA_MINIO_BUCKET:rsreach-media}
    minio-access-key: ${RSREACH_MEDIA_MINIO_ACCESS_KEY:}
    minio-secret-key: ${RSREACH_MEDIA_MINIO_SECRET_KEY:}
    minio-region: ${RSREACH_MEDIA_MINIO_REGION:us-east-1}
  billing:
    razorpay:
      key-id: ${RSREACH_RAZORPAY_KEY_ID:}
      key-secret: ${RSREACH_RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RSREACH_RAZORPAY_WEBHOOK_SECRET:}
      live-enabled: ${RSREACH_RAZORPAY_LIVE_ENABLED:false}
      live-orders: ${RSREACH_RAZORPAY_LIVE_ORDERS:${RSREACH_RAZORPAY_LIVE_ENABLED:false}}
  security:
    # Default deny. Local profile may open OpenAPI only; auth endpoints remain explicitly public.
    permit-unauthenticated-api: ${RSREACH_SECURITY_PERMIT_UNAUTHENTICATED_API:false}
    # Disabled by default. Only honored under local profile and never under docker (see DevTokenExposureGate).
    expose-dev-tokens: ${RSREACH_SECURITY_EXPOSE_DEV_TOKENS:false}
    rate-limit-per-minute: ${RSREACH_SECURITY_RATE_LIMIT_PER_MINUTE:120}
  jwt:
    customer:
      secret: ${RSREACH_JWT_CUSTOMER_SECRET:}
      issuer: ${RSREACH_JWT_CUSTOMER_ISSUER:rsreach-customer}
      audience: ${RSREACH_JWT_CUSTOMER_AUDIENCE:rsreach-app}
      access-token-ttl-seconds: ${RSREACH_JWT_CUSTOMER_ACCESS_TTL:900}
      refresh-token-ttl-seconds: ${RSREACH_JWT_CUSTOMER_REFRESH_TTL:2592000}
    staff:
      secret: ${RSREACH_JWT_STAFF_SECRET:}
      issuer: ${RSREACH_JWT_STAFF_ISSUER:rsreach-staff}
      audience: ${RSREACH_JWT_STAFF_AUDIENCE:rsreach-platform}
      access-token-ttl-seconds: ${RSREACH_JWT_STAFF_ACCESS_TTL:900}
      refresh-token-ttl-seconds: ${RSREACH_JWT_STAFF_REFRESH_TTL:2592000}
  bootstrap:
    staff-email: ${RSREACH_BOOTSTRAP_STAFF_EMAIL:}
    staff-password: ${RSREACH_BOOTSTRAP_STAFF_PASSWORD:}
  worker:
    concurrency: ${RSREACH_WORKER_CONCURRENCY:4}
  secrets:
    active-key-alias: ${RSREACH_SECRETS_KEY_ALIAS:rsreach-master}
    active-key-version: ${RSREACH_SECRETS_KEY_VERSION:1}
