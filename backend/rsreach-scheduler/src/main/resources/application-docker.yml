rsreach:
  webhooks:
    allow-mock-signatures: false
  secrets:
    master-key: ${RSREACH_SECRETS_MASTER_KEY}
  security:
    permit-unauthenticated-api: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
