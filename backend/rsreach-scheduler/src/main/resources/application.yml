spring:
  application:
    name: rsreach-scheduler
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${RSREACH_DB_URL:jdbc:postgresql://localhost:5432/rsreach}
    username: ${RSREACH_DB_USER:rsreach}
    password: ${RSREACH_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${RSREACH_DB_POOL_SIZE:5}
      minimum-idle: ${RSREACH_DB_POOL_MIN_IDLE:1}
      connection-timeout: ${RSREACH_DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

server:
  port: ${RSREACH_SCHEDULER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    com.rsreach: INFO

rsreach:
  app:
    role: scheduler
  security:
    permit-unauthenticated-api: ${RSREACH_SECURITY_PERMIT_UNAUTHENTICATED_API:false}
  scheduler:
    tick-interval-ms: ${RSREACH_SCHEDULER_TICK_INTERVAL_MS:5000}
    batch-size: ${RSREACH_SCHEDULER_BATCH_SIZE:100}
    billing-renewal-ms: ${RSREACH_SCHEDULER_BILLING_RENEWAL_MS:300000}
  billing:
    razorpay:
      key-id: ${RSREACH_RAZORPAY_KEY_ID:}
      key-secret: ${RSREACH_RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RSREACH_RAZORPAY_WEBHOOK_SECRET:}
      live-enabled: ${RSREACH_RAZORPAY_LIVE_ENABLED:false}
  secrets:
    active-key-alias: ${RSREACH_SECRETS_KEY_ALIAS:rsreach-master}
    active-key-version: ${RSREACH_SECRETS_KEY_VERSION:1}
